services:
  api:
    build:
      context: .
      target: api-dev
    environment:
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_GRAPH_API_VERSION: ${FACEBOOK_GRAPH_API_VERSION:-v26.0}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - ./apps/api/prisma:/workspace/apps/api/prisma
      - ./apps/api/prisma.config.ts:/workspace/apps/api/prisma.config.ts:ro
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      target: web-dev
    environment:
      API_PROXY_TARGET: http://api:3001
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/public:/workspace/apps/web/public
      - ./apps/web/next.config.ts:/workspace/apps/web/next.config.ts:ro
      - ./apps/web/postcss.config.mjs:/workspace/apps/web/postcss.config.mjs:ro
      - ./apps/web/tsconfig.json:/workspace/apps/web/tsconfig.json:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"
