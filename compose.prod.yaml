services:
  api:
    build:
      context: .
      target: api
    environment:
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:-}
      WEB_ORIGIN: ${PROD_WEB_ORIGIN:-http://localhost:8080}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_IMAGES_BUCKET: ${SUPABASE_SERVICE_IMAGES_BUCKET:-service-images}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PROD_WEB_PORT:-8080}:5173"
    restart: unless-stopped
