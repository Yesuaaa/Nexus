packages:
  - apps/*

overrides:
  # Remove when Prisma configuration uses a patched Effect release.
  "@prisma/config>effect": "3.22.1"
  # Keep glob consumers on a release that fixes GHSA-g3hv-75wg-m249.
  "minimatch@>=7.0.0 <11.0.1": "11.0.9"
  # Remove once typescript-estree can use a picomatch release that fixes GHSA-fc5q-39xc-vjpf.
  "@typescript-eslint/typescript-estree@8.72.0>tinyglobby": "-"

packageExtensions:
  "@typescript-eslint/typescript-estree@8.72.0":
    dependencies:
      glob: 14.0.6

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true

patchedDependencies:
  "@typescript-eslint/typescript-estree@8.72.0": patches/@typescript-eslint__typescript-estree@8.72.0.patch
  sileo@0.1.6: patches/sileo@0.1.6.patch
