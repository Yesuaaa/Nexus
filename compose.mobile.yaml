services:
  api:
    environment:
      PORT: "3001"
      NODE_ENV: "development"
    ports:
      - "${API_PORT:-3001}:3001"

  mobile-test:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      target: test
    environment:
      GRADLE_USER_HOME: /root/.gradle
    volumes:
      - ./apps/mobile:/workspace/apps/mobile
      - mobile-gradle-cache:/root/.gradle
    working_dir: /workspace/apps/mobile

  mobile-build:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      target: build
    environment:
      GRADLE_USER_HOME: /root/.gradle
    volumes:
      - ./apps/mobile:/workspace/apps/mobile
      - mobile-gradle-cache:/root/.gradle
    working_dir: /workspace/apps/mobile

volumes:
  mobile-gradle-cache:
